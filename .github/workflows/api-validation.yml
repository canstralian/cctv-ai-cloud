name: API validation

# Reusable: invoked by ci.yml, which decides whether the API changed and
# reports the one aggregate check that branch protection should require.
# workflow_dispatch stays for running the gates by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python API quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install application and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # pip-audit is deliberately unpinned: it should pick up advisories
          # published after this commit. Ruff and Bandit are pinned in
          # requirements-dev.txt so a tool release cannot turn this gate red
          # on a commit that changed nothing, and so local runs match CI.
          python -m pip install pip-audit

      - name: Ruff lint
        # Rule configuration, including the flake8-bugbear immutable-call
        # exemptions for FastAPI's Query/Depends markers, lives in api/ruff.toml.
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Bandit static security analysis
        run: python -m bandit -q -r app main.py

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Test
        run: python -m pytest
