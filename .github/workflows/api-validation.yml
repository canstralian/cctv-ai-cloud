name: API validation

on:
  pull_request:
    paths:
      - "api/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/api-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python API quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install application and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # pip-audit is deliberately unpinned: it should pick up advisories
          # published after this commit. Ruff and Bandit are pinned in
          # requirements-dev.txt so a tool release cannot turn this gate red
          # on a commit that changed nothing, and so local runs match CI.
          python -m pip install pip-audit

      - name: Ruff lint
        # Rule configuration, including the flake8-bugbear immutable-call
        # exemptions for FastAPI's Query/Depends markers, lives in api/ruff.toml.
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Bandit static security analysis
        run: python -m bandit -q -r app main.py

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Test
        run: python -m pytest
