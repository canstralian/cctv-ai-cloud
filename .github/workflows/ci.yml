name: CI

# One workflow, always triggered, so branch protection has a check that is
# always reported. Path filtering happens *inside* the run (the `changes` job)
# rather than in `on:`: a workflow skipped by an `on.paths` filter never
# reports, and a required check that never reports stays Pending and blocks
# the PR forever.
#
# Branch protection should require exactly one check: `CI / required`.
#
# The push trigger is post-merge verification, not a gate: it catches a main
# that went red after a merge (e.g. two PRs green alone, broken together).
# The gate is `required` on the pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          all() { echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; }

          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              # A first push (or a force push the runner cannot resolve) has
              # no usable base: validate everything rather than nothing.
              if [ "$PUSH_BEFORE" = "$zero" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                echo "No usable push base; running all services."; all; exit 0
              fi
              range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) echo "Event '$EVENT' runs all services."; all; exit 0 ;;
          esac

          files=$(git diff --name-only "$range")
          printf 'Changed files:\n%s\n' "$files"

          # ci.yml and the gate scripts count for both: changing the
          # orchestration must prove it still runs every service.
          match() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "api=$(match '^(api/|scripts/|docker-compose\.yml$|\.github/workflows/(api-validation|ci)\.yml$|\.github/scripts/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(match '^(web/|\.github/workflows/(web-validation|ci)\.yml$|\.github/scripts/)')" >> "$GITHUB_OUTPUT"

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api-validation.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-validation.yml

  required:
    # The single check branch protection requires. Runs on every event. The
    # decision lives in .github/scripts/ci-gate.sh: a service job must have
    # succeeded if its selector is true and been skipped if it is false;
    # anything else, including a failed change detection, fails the gate.
    name: required
    needs: [changes, api, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Self-test the gate (outcome matrix)
        # If the gate logic regresses, this fails and so does `required`.
        run: bash .github/scripts/test-ci-gate.sh

      - name: Evaluate selectors and service results
        env:
          CHANGES: ${{ needs.changes.result }}
          API_SELECTED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
        run: bash .github/scripts/ci-gate.sh
