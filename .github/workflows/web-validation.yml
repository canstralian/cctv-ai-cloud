name: Web validation

on:
  pull_request:
    paths: &web-paths
      - "web/**"
      - ".github/workflows/web-validation.yml"
  push:
    branches: [main]
    paths: *web-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the node:22-alpine image the compose web service runs.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm ci, not install: fails if package-lock.json drifts from
        # package.json instead of silently rewriting it.
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Typecheck and build
        # The build script is `tsc -b && vite build`, so this is the type gate too.
        run: npm run build
