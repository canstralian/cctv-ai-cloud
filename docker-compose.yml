services:
  api:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      # Optional: the app ships working dev defaults without it.
      - path: .env
        required: false
    environment:
      # The container mounts ./api at /app, so the repo-root-relative default
      # does not apply here. Point at the mounted data volume explicitly.
      DATABASE_PATH: /data/cctv.db
    volumes:
      - ./api:/app
      - ./data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ml:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      # Optional: the app ships working dev defaults without it.
      - path: .env
        required: false
    volumes:
      - ./ml:/app
      - ./models:/models
      - ./data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             tail -f /dev/null"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nvr:
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    shm_size: "512mb"
    ports:
      - "5000:5000"
      - "8554:8554"
    volumes:
      - ./data:/media/frigate
      - ./nvr/config.yml:/config/config.yml:ro
    restart: unless-stopped

volumes:
  # Keeps the container's node_modules off the host bind mount, so a Linux
  # container and a macOS host do not fight over native builds.
  web_node_modules:
